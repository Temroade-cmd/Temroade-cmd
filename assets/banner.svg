<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Tamer Benturquia">
<style>
  :root { --bg:#f6f4ef; --ink:#141414; --mute:#7a7770; --rule:#141414; --pulse:#d6402b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --ink:#e9e6df; --mute:#8b8a85; --rule:#e9e6df; --pulse:#ff5a43; }
  }
  .bg { fill:var(--bg); }
  .ink { fill:var(--ink); }
  .mute { fill:var(--mute); }
  .serif { font-family: Georgia, 'Times New Roman', Times, serif; }
  .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  .rule { stroke:var(--rule); stroke-width:1; }
  .rule2 { stroke:var(--rule); stroke-width:3; }
  .grid { stroke:var(--mute); stroke-width:.5; opacity:.18; }
  .trace { fill:none; stroke:var(--ink); stroke-width:2; stroke-linejoin:round; stroke-linecap:round; opacity:.18; }
  .live { fill:none; stroke:var(--pulse); stroke-width:2.4; stroke-linejoin:round; stroke-linecap:round;
          stroke-dasharray: 140 1860; animation: run 5.5s linear infinite; }
  @keyframes run { from { stroke-dashoffset: 2000; } to { stroke-dashoffset: 0; } }
  .fade { opacity:0; animation: in 1.2s ease forwards; }
  .d1 { animation-delay:.1s } .d2 { animation-delay:.45s } .d3 { animation-delay:.8s } .d4 { animation-delay:1.1s }
  @keyframes in { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform:none; } }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .beat { transform-origin: 1137px 72px; animation: beat 1.1s ease-in-out infinite; }
  @keyframes beat { 0%,100% { transform: scale(1); } 12% { transform: scale(1.25); } 24% { transform: scale(1); } 36% { transform: scale(1.15); } }
</style>
